<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CalcFlow : calculatrice à feuille libre, résultats réutilisables par glisser-déposer, conversion de devises et de cryptos.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CalcFlow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Crect x='9' y='20' width='46' height='24' rx='12' fill='none' stroke='%23f0993a' stroke-width='4'/%3E%3C/svg%3E">
<title>CalcFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200..600&display=swap">
<style>
/* CalcFlow : feuille de calcul libre façon Tydlig, habillage de la Calculatrice Apple.
   Mise en page : feuille en haut, clavier capsule en bas (40 % de l'écran sur iPhone, 33 % sur iPad) ; clavier à droite en paysage. */
:root{
  color-scheme:dark;
  --bg:#000;
  --k-num:#333335; --k-num-on:#737375;
  --k-top:#5d5d60; --k-top-on:#a3a3a6;
  --k-sci:#212123; --k-sci-on:#4a4a4d;
  --k-op:#f0993a;  --k-op-on:#f9cb98;
  --t1:#fff; --t2:rgba(235,235,245,.6); --t3:rgba(235,235,245,.3); --t4:rgba(235,235,245,.17);
  --s1:#1c1c1e; --s2:#2c2c2e; --s3:#3a3a3c; --line:rgba(84,84,88,.55);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.25,.1,.25,1);
  --sheet:cubic-bezier(.32,.72,0,1);
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--t1);font-family:var(--font);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Structure ---------- */
#ink,#inkp{grid-area:canvas;width:100%;height:100%;pointer-events:none;touch-action:none;z-index:4}
#inkp{pointer-events:none!important}
body.pen #ink{pointer-events:auto;cursor:crosshair}
#inkp{z-index:5}
#inkhud{grid-area:canvas;align-self:end;justify-self:start;z-index:6;margin:8px 12px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.72);color:#8e8e93;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden}
.ico[aria-pressed="true"]{background:#0a84ff;color:#fff}
#app{height:100%;display:grid;grid-template:"bar" auto "canvas" minmax(0,1fr) "kbd" 40% / minmax(0,1fr);
  padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px)}
body.regular:not(.side) #app{grid-template-rows:auto minmax(0,1fr) 33%}
body.regular.fxopen:not(.side) #app{grid-template-rows:auto minmax(0,1fr) auto} /* volet fx : le clavier grandit, la feuille se réduit */
body.side #app{grid-template:"bar kbd" auto "canvas kbd" minmax(0,1fr) / minmax(0,1fr) var(--kw)}

.bar{grid-area:bar;display:flex;align-items:center;justify-content:space-between;padding:6px 16px 2px}
.ico{width:44px;height:44px;flex:none;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;
  background:rgba(118,118,128,.2);box-shadow:inset 0 .5px 0 rgba(255,255,255,.16),0 0 0 .5px rgba(255,255,255,.05);
  touch-action:manipulation;transition:background-color .35s var(--ease),opacity .2s}
.ico:active{background:rgba(118,118,128,.42);transition:none}
.ico:disabled{opacity:.3;cursor:default}
.ico svg{width:21px;height:21px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--k-op);outline-offset:2px}

/* ---------- Feuille ---------- */
#canvas{grid-area:canvas;position:relative;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#canvas::-webkit-scrollbar{display:none}
#sheet{position:relative;overflow:hidden;font-size:var(--fs,32px);--row:1.9em;min-width:100%;min-height:100%;cursor:text}
/* Réseau organique : membranes et connecteurs dessinés sous le texte, dans la feuille, pour défiler avec lui */
#net{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
#sheet .res{box-shadow:none}
#sheet .tk.ref.solo{background:none}
.ex{position:absolute;left:calc(var(--c)*1em);top:calc(var(--r)*var(--row));height:var(--row);display:flex;align-items:center;
  white-space:nowrap;font-weight:300;letter-spacing:-.015em;line-height:1;font-variant-numeric:tabular-nums}
.tk{padding:0 .03em}
.tk.o{color:var(--t2);padding:0 .2em}
.tk.o.w{font-size:.56em;font-weight:500;letter-spacing:.05em;padding:0 .45em}
.tk.b{color:var(--t2);padding:0 .05em}
.tk.ref{display:inline-flex;align-items:baseline;margin:0 .06em;padding:.07em .3em .09em;border-radius:.42em;color:var(--rc,var(--t1));font-weight:400}
.ghostp{color:var(--t3);padding-left:.03em}
.eq{color:var(--t2);padding:0 .2em 0 .24em}
.res,.tk.ref.solo{display:inline-flex;align-items:baseline;padding:.07em .3em .09em;border-radius:.42em;font-variant-numeric:tabular-nums;
  touch-action:none;cursor:grab}
.res{box-shadow:inset 0 0 0 .055em var(--t4);color:var(--t1);background:rgba(0,0,0,.001);font-weight:600}
.res.linked{box-shadow:inset 0 0 0 .055em var(--rc);color:var(--rc);font-weight:400} /* résultat intermédiaire : pas de gras, réservé au résultat final */
.tk.ref.solo{background:var(--rc,var(--s3));color:var(--rt,#fff)}
.res.edit{cursor:text}
.res.err{font-size:.55em;font-weight:500;color:var(--t3);box-shadow:none;cursor:default;letter-spacing:.02em}
.u{font-size:.42em;font-weight:500;letter-spacing:.06em;margin-left:.4em}
.x{font-size:.72em}
.caret{flex:none;width:2px;height:1.08em;margin:0 .02em;border-radius:1px;background:var(--k-op);animation:blink 1.05s step-end infinite}
@keyframes blink{50%{opacity:0}}
.ico.shake,.ex.shake{animation:shake .34s var(--ease)}
@keyframes shake{20%{transform:translateX(-.12em)}40%{transform:translateX(.1em)}60%{transform:translateX(-.07em)}80%{transform:translateX(.04em)}}

/* Glisser-déposer */
.float{position:fixed;left:0;top:0;z-index:40;pointer-events:none;will-change:transform;font-weight:300;letter-spacing:-.015em;line-height:1}
.float>*{background:var(--s1)!important;transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.float>.tk.ref.solo{background:var(--rc)!important}
.float.lift>*{transform:scale(1.07);box-shadow:inset 0 0 0 .055em var(--rc,var(--t3)),0 16px 36px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.45)}
.float.land{transition:transform .3s var(--spring),opacity .3s var(--ease)}
.src-drag{opacity:.4}
.slot{flex:none;display:inline-block;width:0;height:1.12em;margin:0 .04em;transition:width .24s var(--ease)}
body.dragging,body.dragging *{cursor:grabbing!important}

/* ---------- Clavier ---------- */
#kbd{grid-area:kbd;display:flex;flex-direction:column;justify-content:flex-end;gap:var(--g,12px);padding:10px 16px 12px;min-height:0;min-width:0}
body.side #kbd{padding:12px 16px 16px 6px}
.grid{display:grid;gap:var(--g,12px)}
.grid.main{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,var(--rh,64px))}
.grid.fx{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,var(--rh,64px))}
.grid.fx .key[data-k="cur"]{grid-column:span 2}
.grid.swap{animation:fade .16s var(--ease)}
@keyframes fade{from{opacity:.25}}
.key{container-type:size;position:relative;min-width:0;min-height:0;padding:0;border:0;border-radius:999px;display:grid;place-items:center;
  background:var(--k);color:#fff;cursor:pointer;touch-action:manipulation;transition:background-color .42s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.05)}
.key.on{background:var(--kon);transition:none}
.key.num{--k:var(--k-num);--kon:var(--k-num-on)}
.key.top{--k:var(--k-top);--kon:var(--k-top-on)}
.key.sci{--k:var(--k-sci);--kon:var(--k-sci-on)}
.key.op{--k:var(--k-op);--kon:var(--k-op-on)}
.key.lit{--k:#0a84ff;--kon:#5eb0ff} /* fx déployé : la touche s'allume en bleu */
.key>span{font-size:min(44cqh,30cqw);font-weight:400;line-height:1;display:block;white-space:nowrap}
.key.op>span{font-size:min(56cqh,36cqw);font-weight:400}
.key.top>span{font-size:min(40cqh,28cqw)}
.key.sci>span{font-size:min(34cqh,21cqw)}
.key.cur>span{font-size:min(30cqh,17cqw);font-weight:500;letter-spacing:.01em}
.key sup,.key sub{font-size:.62em;line-height:0}
.key sup{position:relative;top:-.05em}
.key svg{display:block;width:1.15em;height:1.15em}
.key[data-k="deg"]>span{color:var(--k-op)}
.key.num:not([data-k="layer"])>span,.key.op>span{font-weight:600} /* chiffres et opérations de base en gras */
.key .chev{display:inline-block;width:.62em;height:.62em;margin-left:.18em;vertical-align:.06em;stroke-width:2.4;transition:transform .3s var(--spring)}
.key.open .chev{transform:rotate(180deg)}
.pm{letter-spacing:-.06em}
/* ⌫ glissé vers la gauche : la touche s'efface comme un volet et découvre l'effacement de toute la feuille */
.key.swipe{overflow:hidden;touch-action:none}
.key.swipe.open{background:#ff453a}
.key.swipe>span{position:absolute;inset:0;display:grid;place-items:center;border-radius:inherit;background:var(--k);box-shadow:inherit;transition:background-color .42s var(--ease)}
.key.swipe.on>span{background:var(--kon);transition:none}
.key.swipe .bin{position:absolute;left:0;top:50%;font-size:min(40cqh,28cqw);margin-top:-.575em;transition:scale .2s var(--spring)}
.key.swipe.armed .bin{scale:1.2}

/* ---------- Feuille de conversion ---------- */
#scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s var(--ease)}
#scrim.open{opacity:1}
#conv{position:fixed;z-index:31;left:50%;bottom:0;width:min(100%,560px);height:min(88%,760px);display:flex;flex-direction:column;
  transform:translate(-50%,104%);transition:transform .4s var(--sheet);border-radius:24px 24px 0 0;color:var(--t1);
  background:rgba(28,28,30,.95);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);
  box-shadow:0 -12px 40px rgba(0,0,0,.55),inset 0 .5px 0 rgba(255,255,255,.14);padding-bottom:env(safe-area-inset-bottom,0px)}
#conv.open{transform:translate(-50%,0)}
body.regular:not(.side) #conv{height:min(66%,720px)}
body.side #conv{left:auto;right:0;top:0;bottom:0;height:auto;width:var(--kw);transform:translateX(104%);border-radius:24px 0 0 24px;
  padding-top:env(safe-area-inset-top,0px)}
body.side #conv.open{transform:none}
.grab{flex:none;width:36px;height:5px;border-radius:3px;background:var(--t3);margin:8px auto 0}
body.side .grab{visibility:hidden}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;touch-action:none}
.sh-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.sh-head .ico{width:32px;height:32px}
.sh-head .ico svg{width:15px;height:15px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:0 16px 12px}
.slotb{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding:10px 14px 11px;border:0;border-radius:16px;
  background:var(--s2);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s var(--ease)}
.slotb.sel{box-shadow:inset 0 0 0 1.5px var(--k-op)}
.slotb small{font-size:12px;color:var(--t2);letter-spacing:.02em}
.slotb b{font-size:22px;font-weight:600;letter-spacing:.02em}
.slotb .nm{font-size:13px;color:var(--t2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recents{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.recents::-webkit-scrollbar{display:none}
.chipbtn{flex:none;height:34px;padding:0 13px;border:0;border-radius:99px;background:var(--s2);font-size:14px;font-weight:500;letter-spacing:.03em;cursor:pointer}
.chipbtn:active{background:var(--s3)}
.chipbtn i{font-style:normal;color:var(--k-op);margin:0 .4em}
.search{display:flex;align-items:center;gap:8px;height:40px;margin:0 16px 4px;padding:0 4px 0 11px;border-radius:12px;background:rgba(118,118,128,.24)}
.search>svg{width:17px;height:17px;flex:none;color:var(--t2)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--t1);font:inherit;font-size:17px;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--t2)}
.search input::-webkit-search-cancel-button{display:none}
#qx{width:30px;height:30px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:none;color:var(--t2);cursor:pointer}
#qx svg{width:16px;height:16px;padding:3px;border-radius:50%;background:rgba(235,235,245,.3);color:#1c1c1e;stroke-width:2.6}
.lhead{padding:10px 24px 2px;font-size:13px;color:var(--t2)}
.list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 8px 8px}
.sec{position:sticky;top:0;z-index:1;padding:12px 8px 6px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t2);
  background:linear-gradient(rgb(28,28,30) 72%,rgba(28,28,30,0))}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto 20px;align-items:center;gap:8px;width:100%;min-height:48px;padding:6px 8px;
  border:0;border-radius:12px;background:none;text-align:left;cursor:pointer}
.row:hover{background:rgba(118,118,128,.14)}
.row:active{background:rgba(118,118,128,.24)}
.row b{font-size:16px;font-weight:600;letter-spacing:.03em}
.row .nm{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{font-size:14px;color:var(--t2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rt small{font-size:11px;letter-spacing:.05em;margin-left:.35em}
.row svg{width:18px;height:18px;color:var(--k-op);stroke-width:2.4}
.empty{margin:24px 16px;font-size:15px;color:var(--t2)}
.sh-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 14px;border-top:.5px solid var(--line)}
.rates{display:flex;align-items:center;gap:4px;min-width:0;font-size:12px;color:var(--t2)}
.rates span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rates .ico{width:36px;height:36px;background:none;box-shadow:none}
.rates .ico svg{width:17px;height:17px}
.rates .ico.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.acts{display:flex;align-items:center;gap:4px;flex:none}
.cta{height:44px;padding:0 22px;border:0;border-radius:99px;background:var(--k-op);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.cta:active{background:var(--k-op-on)}
.txt{height:44px;padding:0 12px;border:0;background:none;color:var(--k-op);font-size:17px;cursor:pointer}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .caret{animation:none}
}
@media (prefers-reduced-transparency:reduce){#conv{background:var(--s1);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>

</head>
<body>
<div id="app">
  <div class="bar">
    <button class="ico" id="undo" type="button" aria-label="Annuler" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ico" id="pen" type="button" aria-label="Écrire à la main" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg></button>
  </div>
  <main id="canvas" aria-label="Feuille de calcul">
    <div id="sheet"><canvas id="net" aria-hidden="true"></canvas></div>
  </main>
  <canvas id="ink" aria-hidden="true"></canvas>
  <section id="kbd" aria-label="Clavier"></section>
</div>
<div class="vh" id="live" aria-live="polite"></div>

<div id="scrim" hidden></div>
<div id="conv" role="dialog" aria-modal="true" aria-labelledby="convTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sh-head" id="convHead">
    <h2 id="convTitle">Conversion</h2>
    <button class="ico" id="convClose" type="button" aria-label="Fermer"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="pair">
    <button class="slotb" id="slot-from" data-slot="from" type="button"><small>De</small><b></b><span class="nm"></span></button>
    <button class="ico" id="swap" type="button" aria-label="Inverser les devises"><svg class="i" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 12 4 4-4 4"/><path d="M21 16H7"/></svg></button>
    <button class="slotb" id="slot-to" data-slot="to" type="button"><small>Vers</small><b></b><span class="nm"></span></button>
  </div>
  <div class="recents" id="recents" aria-label="Conversions récentes"></div>
  <label class="search">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="q" type="search" placeholder="Devise, crypto, pays…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Rechercher une devise">
    <button id="qx" type="button" aria-label="Effacer la recherche" hidden><svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </label>
  <div class="lhead" id="lhead"></div>
  <div class="list" id="list" role="listbox" aria-labelledby="lhead"></div>
  <div class="sh-foot">
    <div class="rates"><button class="ico" id="refresh" type="button" aria-label="Actualiser les taux"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button><span id="rateInfo"></span></div>
    <div class="acts"><button class="txt" id="convRemove" type="button">Retirer</button><button class="cta" id="convApply" type="button">Convertir</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const NB = ' ', ROW = 1.9;
const app = $('#app'), canvas = $('#canvas'), sheet = $('#sheet'), kbd = $('#kbd');

/* Couleurs système Apple pour relier une source à ses réutilisations : [teinte, texte sur fond plein] */
const PAL = [['#30D158','#04210e'],['#0A84FF','#fff'],['#BF5AF2','#fff'],['#FFD60A','#2a2300'],
             ['#FF375F','#fff'],['#64D2FF','#00263a'],['#5E5CE6','#fff'],['#66D4CF','#002624']];

/* ---------------- Devises et cryptomonnaies ---------------- */
const CUR = [
 ['EUR','Euro','€ europe zone euro france','f'],['USD','Dollar américain','$ dollar us usa etats unis amerique','f'],
 ['GBP','Livre sterling','£ pound royaume uni angleterre','f'],['CHF','Franc suisse','suisse','f'],
 ['JPY','Yen japonais','¥ japon','f'],['CAD','Dollar canadien','canada','f'],['AUD','Dollar australien','australie','f'],
 ['NZD','Dollar néo-zélandais','nouvelle zelande','f'],['CNY','Yuan renminbi','chine rmb','f'],['HKD','Dollar de Hong Kong','hong kong','f'],
 ['SGD','Dollar de Singapour','singapour','f'],['KRW','Won sud-coréen','coree','f'],['INR','Roupie indienne','inde','f'],
 ['SEK','Couronne suédoise','suede','f'],['NOK','Couronne norvégienne','norvege','f'],['DKK','Couronne danoise','danemark','f'],

const KMAP = {'+':'add','-':'sub','*':'mul','x':'mul','X':'mul','/':'div',':':'div','^':'pow','%':'pct','!':'fact','Enter':'eq','=':'eq',
  'Backspace':'back','Delete':'back',',':'dec','.':'dec','(':'lp',')':'rp'};
addEventListener('keydown', ev => {

/* ---------------- Conversion ---------------- */

function applyConv(from, to) {
  if (from === to) return;
  snap();

  const p = from + '>' + to;
  S.recents = [p].concat(S.recents.filter(x => x !== p)).slice(0, 5);
  closeConv();
  if (CV.src != null) { // une nouvelle cellule, reliée au résultat, porte sa valeur convertie
    const s = byId(CV.src);
    if (s) {
      tint(s.id);
      const ea = emptyActive(), q = free(s.r + NEXT, s.c, 6, true, ea); // même écart qu'un calcul ; la ligne vide en attente cède sa place
      const e = {id:S.seq++, r:q.r, c:q.c, t:[R(s.id)], conv:{from, to}, col:null, done:true};
      S.ex.push(e); popId = e.id;

function setQuery(v, silent) { qIn.value = v; $('#qx').hidden = !v; if (!silent) renderList(); }

  for (const s of ['from', 'to']) {

/* Recherche tolérante : mots dans n'importe quel ordre, accents et mots vides ignorés, fautes de frappe admises */
const STOP = new Set('le la les l de du des d un une et en au aux a pour par vers sur'.split(' '));
const norm = s => s.toLowerCase().replace(/€/g, ' euro ').replace(/\$/g, ' dollar ').replace(/£/g, ' livre ').replace(/¥/g, ' yen ').replace(/₿/g, ' bitcoin ')
  .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const words = s => norm(s).split(' ').filter(w => w && !STOP.has(w));
const INDEX = CUR.map((c, k) => ({c, k, w:words(c[0] + ' ' + c[1] + ' ' + c[2]), code:c[0].toLowerCase()}));
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({length:b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) { cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); best = Math.min(best, cur[j]); }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function wscore(q, ws) {
  const tol = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0;
  let best = 0;
  for (const w of ws) {
    let s = 0;
    if (w === q) s = 4;
    else if (w.startsWith(q)) s = 3;
    else if (q.length >= 3 && w.includes(q)) s = 2;
    else if (tol && (lev(q, w, tol) <= tol || (w.length > q.length && lev(q, w.slice(0, q.length), tol) <= tol))) s = 1;
    if (s > best) best = s;
  }
  return best;
}
function searchCur(q) {
  const qs = words(q); if (!qs.length) return null;
  const res = INDEX.map(it => {
    let tot = 0, hit = 0;
    for (const x of qs) { const s = wscore(x, it.w); if (s) { hit++; tot += s; } }
    if (qs.includes(it.code)) tot += 6;
    return {it, tot, hit};
  }).filter(r => r.hit);
  const full = res.filter(r => r.hit === qs.length).sort((a, b) => b.tot - a.tot || a.it.k - b.it.k);
  if (full.length) return {approx:false, list:full.map(r => r.it.c)};
  res.sort((a, b) => b.hit - a.hit || b.tot - a.tot || a.it.k - b.it.k);
  return {approx:true, list:res.slice(0, 12).map(r => r.it.c)};
}

/* Taux en direct (API publique Coinbase, base EUR) ; repli sur le dernier relevé connu */
async function fetchRates() {
  try {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 7000);
    const r = await fetch('https://api.coinbase.com/v2/exchange-rates?currency=EUR', {signal:ctl.signal});
    clearTimeout(tm);
    if (!r.ok) throw 0;
    const j = await r.json(), src = j && j.data && j.data.rates;
    if (!src) throw 0;
    const next = {EUR:1}; let n = 0;
    for (const [c] of CUR) { if (c === 'EUR') continue; const v = parseFloat(src[c]); if (v > 0) { next[c] = v; n++; } else next[c] = RATES.rates[c]; }
    if (n < 20) throw 0;
    RATES = {date:new Date().toISOString(), rates:next, live:true}; rateFail = false;
    wr(RKEY, {date:RATES.date, rates:next});
    render();
  } catch (e) { rateFail = true; }
  rateInfo();
}

  if (changed) buildKeys();

  render();
}
let lt = 0;
addEventListener('resize', () => { cancelAnimationFrame(lt); lt = requestAnimationFrame(layout); });
